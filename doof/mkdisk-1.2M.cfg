# dosbox configuration to build 1.2MB (5.25") DOOF install disk image

[sdl]
usescancodes = false
fullscreen = false
fullresolution = 640 x 480

[render]
aspect = false
scaler = none

[midi]
mpu401 = none
mididevice = none

[speaker]
pcspeaker = false
tandy = off
disney = false

[joystick]
joysticktype = none

[sblaster]
sbtype = none
oplmode = none

[gus]
gus = false

[cpu]
cycles = fixed 12000

[ipx]
ipx = false

[autoexec]
imgmount a doof-1.2M.img -t floppy
mount c .
c:

copy c:\boot\*.exe a:\
copy c:\boot\*.sys a:\
copy c:\boot\*.bat a:\
copy c:\boot\*.cfg a:\
copy c:\boot\*.txt a:\
copy doof.exe a:\doof.1
copy c:\install\*.* a:\
dir a: > dirlist.txt
exit

